<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Agent // Autonomous Trading Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 20, 31, 0.75);
      --card-border: rgba(255, 255, 255, 0.07);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --neon-green: #00f59b;
      --neon-red: #ff3b69;
      --neon-cyan: #00e5ff;
      --neon-amber: #ffb800;
      --neon-purple: #a855f7;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.04) 0%, transparent 40%);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00e5ff, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #000;
    }
    .brand-title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 999px;
      font-size: 11px; font-weight: 700; font-family: var(--font-mono);
      background: rgba(0, 245, 155, 0.1); color: var(--neon-green);
      border: 1px solid rgba(0, 245, 155, 0.25);
    }
    .status-pill.offline {
      background: rgba(255, 59, 105, 0.1); color: var(--neon-red);
      border-color: rgba(255, 59, 105, 0.25);
    }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    .btn-kill {
      padding: 8px 18px; border-radius: 8px;
      border: 1px solid rgba(0, 245, 155, 0.3);
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      cursor: pointer; background: rgba(0, 245, 155, 0.08); color: var(--neon-green);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-kill:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 245, 155, 0.2); }
    .btn-kill.active {
      background: linear-gradient(135deg, rgba(255, 59, 105, 0.9), rgba(225, 29, 72, 0.9));
      color: #fff; border-color: var(--neon-red);
      box-shadow: 0 0 20px rgba(255, 59, 105, 0.4);
      animation: alertPulse 1.5s infinite;
    }
    @keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    .section-title {
      font-size: 11px; text-transform: uppercase; font-family: var(--font-mono);
      font-weight: 700; letter-spacing: 0.1em; color: var(--text-muted);
      margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between;
    }
    .grid { display: grid; gap: 1rem; margin-bottom: 1.5rem; }
    .symbols-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .desk-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); }
    .sym-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .sym-title { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
    .sym-sub { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-left: 6px; }
    .price-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.5rem; }
    .price-wrap { display: flex; align-items: baseline; gap: 8px; }
    .price-val {
      font-size: 2.1rem; font-family: var(--font-mono); font-weight: 700;
      font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
      transition: color 0.3s, text-shadow 0.25s, filter 0.25s;
      color: var(--neon-green);
    }
    .price-val.bullish { color: var(--neon-green); }
    .price-val.bearish { color: var(--neon-red); }
    .price-val.flash-up {
      filter: brightness(1.4);
      text-shadow: 0 0 18px rgba(0, 245, 155, 0.7);
    }
    .price-val.flash-down {
      filter: brightness(1.4);
      text-shadow: 0 0 18px rgba(255, 59, 105, 0.7);
    }
    .badge-bull { background: rgba(0, 245, 155, 0.12); color: var(--neon-green); border: 1px solid rgba(0, 245, 155, 0.25); }
    .badge-bear { background: rgba(255, 59, 105, 0.12); color: var(--neon-red); border: 1px solid rgba(255, 59, 105, 0.25); }
    .sparkline-canvas { width: 100%; height: 60px; margin: 0.5rem 0; display: block; }
    .badges-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px;
      font-size: 10px; font-family: var(--font-mono); font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge-regime { background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); border: 1px solid rgba(0, 229, 255, 0.2); }
    .badge-regime.expansion { background: rgba(255, 59, 105, 0.1); color: var(--neon-red); border-color: rgba(255, 59, 105, 0.25); }
    .badge-regime.up { background: rgba(0, 245, 155, 0.1); color: var(--neon-green); border-color: rgba(0, 245, 155, 0.25); }
    .badge-fresh { background: rgba(0, 245, 155, 0.08); color: var(--neon-green); }
    .badge-stale { background: rgba(255, 184, 0, 0.12); color: var(--neon-amber); border: 1px solid rgba(255, 184, 0, 0.3); }
    .orderbook-bar {
      height: 4px; width: 100%; border-radius: 2px;
      background: var(--neon-red); margin-top: 8px; overflow: hidden;
      display: flex;
    }
    .orderbook-bid { height: 100%; background: var(--neon-green); transition: width 0.3s; }
    .desk-val { font-size: 1.5rem; font-family: var(--font-mono); font-weight: 700; margin-top: 4px; }
    .log-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
    }
    .log-filter-row { display: flex; gap: 8px; margin-bottom: 0.75rem; }
    .filter-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03); color: var(--text-muted);
      font-size: 11px; font-family: var(--font-mono); font-weight: 600; cursor: pointer;
    }
    .filter-btn.active { background: rgba(0, 229, 255, 0.15); color: var(--neon-cyan); border-color: var(--neon-cyan); }
    .log-feed {
      height: 280px; overflow-y: auto;
      font-family: var(--font-mono); font-size: 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .log-item {
      padding: 6px 10px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      display: flex; gap: 10px; align-items: baseline;
      border-left: 2px solid transparent;
    }
    .log-item.info { border-left-color: var(--neon-cyan); }
    .log-item.warn { border-left-color: var(--neon-amber); }
    .log-item.error { border-left-color: var(--neon-red); }
    .log-time { color: var(--text-muted); font-size: 11px; }
    .log-tag { font-weight: 700; font-size: 10px; padding: 1px 5px; border-radius: 4px; }
    .tag-INFO { background: rgba(0, 229, 255, 0.15); color: var(--neon-cyan); }
    .tag-WARN { background: rgba(255, 184, 0, 0.15); color: var(--neon-amber); }
    .tag-ERROR { background: rgba(255, 59, 105, 0.15); color: var(--neon-red); }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="logo-badge">M</div>
      <div>
        <div class="brand-title">MARKET-AGENT COCKPIT</div>
        <div class="brand-sub">Binance USDⓈ-M // Sized Paper Engine</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span id="harness-badge" class="badge badge-regime">HARNESS: --</span>
      <div id="conn-pill" class="status-pill offline"><span class="pulse-dot"></span><span id="conn-text">CONNECTING</span></div>
      <button id="btn-kill" class="btn-kill" onclick="toggleKill()">ARMED & SAFE</button>
    </div>
  </header>

  <div class="section-title">
    <span>Live Market Instruments</span>
    <span id="tick-counter" style="color: var(--neon-cyan);">LIVE STREAMING</span>
  </div>
  <div id="symbols-grid" class="grid symbols-grid"></div>

  <div class="section-title">Risk Desk & Exposure Limits</div>
  <div class="grid desk-grid">
    <div class="card"><div class="brand-sub">DESK MODE</div><div id="desk-mode" class="desk-val">--</div></div>
    <div class="card"><div class="brand-sub">SESSION R (PNL)</div><div id="desk-day-r" class="desk-val">0.00 R</div></div>
    <div class="card"><div class="brand-sub">PEAK DRAWDOWN</div><div id="desk-dd" class="desk-val">0.00 R</div></div>
    <div class="card"><div class="brand-sub">CONSECUTIVE LOSSES</div><div id="desk-losses" class="desk-val">0</div></div>
    <div class="card"><div class="brand-sub">OPEN EXPOSURE</div><div id="desk-exp" class="desk-val">0 / 2 POS</div></div>
  </div>

  <div class="section-title">Telemetry & Engine Log</div>
  <div class="log-container">
    <div class="log-filter-row">
      <button class="filter-btn active" onclick="setFilter('ALL', this)">ALL</button>
      <button class="filter-btn" onclick="setFilter('TRADES', this)">TRADES</button>
      <button class="filter-btn" onclick="setFilter('DECISIONS', this)">DECISIONS</button>
      <button class="filter-btn" onclick="setFilter('WARN', this)">ALERTS</button>
    </div>
    <div id="log-feed" class="log-feed"></div>
  </div>

  <script>
    const history = {};
    const sessionOpen = {};
    const lerpTargets = new Map();
    let activeFilter = 'ALL';
    const logs = [];

    function setLerpValue(id, target, opts = {}) {
      const { decimals = 2, prefix = '', suffix = '', onUpdate = null, onDir = null } = opts;
      let entry = lerpTargets.get(id);
      if (!entry) {
        entry = { id, current: target, target, decimals, prefix, suffix, onUpdate };
        lerpTargets.set(id, entry);
        if (onUpdate) onUpdate(target);
        else {
          const el = document.getElementById(id);
          if (el) el.textContent = `${prefix}${target.toFixed(decimals)}${suffix}`;
        }
        return;
      }
      if (onDir && target !== entry.target) {
        onDir(target > entry.target ? 1 : -1);
      }
      entry.target = target;
      entry.decimals = decimals;
      entry.prefix = prefix;
      entry.suffix = suffix;
      entry.onUpdate = onUpdate;
    }

    function runAnimationLoop() {
      function step() {
        for (const item of lerpTargets.values()) {
          const delta = item.target - item.current;
          if (Math.abs(delta) > 0.00005) {
            // Smooth lerp factor (0.12 gives a butter-smooth ~250ms roll)
            item.current += delta * 0.12;
            if (Math.abs(item.target - item.current) < 0.0001) item.current = item.target;
            if (item.onUpdate) {
              item.onUpdate(item.current);
            } else {
              const el = document.getElementById(item.id);
              if (el) el.textContent = `${item.prefix}${item.current.toFixed(item.decimals)}${item.suffix}`;
            }
          }
        }
        // Smooth continuous sparkline drawing
        for (const [sym, points] of Object.entries(history)) {
          const canvas = document.getElementById(`spark-${sym}`);
          if (canvas && points.length > 1) {
            const item = lerpTargets.get(`price-${sym}`);
            const cur = item ? item.current : points[points.length - 1];
            const smoothPoints = [...points.slice(0, -1), cur];
            drawSparkline(canvas, smoothPoints);
          }
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    runAnimationLoop();

    function drawSparkline(canvas, points) {
      if (!points || points.length < 2) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.offsetWidth * 2;
      const h = canvas.height = canvas.offsetHeight * 2;
      ctx.clearRect(0, 0, w, h);
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const step = w / (points.length - 1);
      const isUp = points[points.length - 1] >= points[0];
      const color = isUp ? '#00f59b' : '#ff3b69';

      ctx.beginPath();
      points.forEach((p, i) => {
        const x = i * step;
        const y = h - ((p - min) / range) * (h - 16) - 8;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, isUp ? 'rgba(0, 245, 155, 0.25)' : 'rgba(255, 59, 105, 0.25)');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function renderSymbol(s) {
      let card = document.getElementById(`card-${s.symbol}`);
      if (!card) {
        card = document.createElement('div');
        card.id = `card-${s.symbol}`;
        card.className = 'card';
        card.innerHTML = `
          <div class="sym-header">
            <div><span class="sym-title">${s.symbol}</span><span class="sym-sub">PERP</span></div>
            <span id="stale-${s.symbol}" class="badge badge-fresh">LIVE</span>
          </div>
          <div class="price-row">
            <div class="price-wrap">
              <span id="price-${s.symbol}" class="price-val">--</span>
              <span id="chg-${s.symbol}" class="badge badge-bull">+0.00%</span>
            </div>
            <span id="spread-${s.symbol}" class="brand-sub">Spread: --</span>
          </div>
          <canvas id="spark-${s.symbol}" class="sparkline-canvas"></canvas>
          <div class="badges-row">
            <span id="regime-${s.symbol}" class="badge badge-regime">--</span>
            <span id="fund-${s.symbol}" class="badge" style="background: rgba(255,255,255,0.05);">FR: 0.00%</span>
            <span id="ai-${s.symbol}" class="badge" style="background: rgba(168, 85, 247, 0.1); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.25);">AI: STANDBY</span>
          </div>
          <div class="orderbook-bar"><div id="ob-${s.symbol}" class="orderbook-bid" style="width: 50%;"></div></div>
        `;
        document.getElementById('symbols-grid').appendChild(card);
      }
      const priceEl = document.getElementById(`price-${s.symbol}`);
      const hList = history[s.symbol] = history[s.symbol] || [];
      hList.push(s.mark);
      if (hList.length > 35) hList.shift();

      sessionOpen[s.symbol] = sessionOpen[s.symbol] || s.mark;
      const pct = sessionOpen[s.symbol] > 0 ? ((s.mark - sessionOpen[s.symbol]) / sessionOpen[s.symbol]) * 100 : 0;
      const isBull = s.regime.includes('UP') || (!s.regime.includes('DOWN') && pct >= 0);
      const stanceClass = isBull ? 'bullish' : 'bearish';

      const chgEl = document.getElementById(`chg-${s.symbol}`);
      if (chgEl) {
        chgEl.textContent = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
        chgEl.className = `badge ${pct >= 0 ? 'badge-bull' : 'badge-bear'}`;
      }

      setLerpValue(`price-${s.symbol}`, s.mark, {
        decimals: s.symbol.includes('XRP') ? 4 : 2,
        onDir: (dir) => {
          priceEl.className = `price-val ${stanceClass} ${dir > 0 ? 'flash-up' : 'flash-down'}`;
          setTimeout(() => {
            priceEl.className = `price-val ${stanceClass}`;
          }, 350);
        }
      });
      priceEl.className = `price-val ${stanceClass}`;

      const regEl = document.getElementById(`regime-${s.symbol}`);
      regEl.textContent = s.regime;
      regEl.className = `badge badge-regime ${s.regime.includes('EXPANSION') ? 'expansion' : s.regime.includes('UP') ? 'up' : ''}`;
      if (s.spreadBps !== undefined) {
        setLerpValue(`spread-${s.symbol}`, s.spreadBps, { decimals: 1, prefix: 'Spread: ', suffix: ' bps' });
      }
      if (s.funding !== undefined) document.getElementById(`fund-${s.symbol}`).textContent = `FR: ${(s.funding * 100).toFixed(4)}%`;
      if (s.imbalance !== undefined) {
        const bidPct = Math.max(10, Math.min(90, 50 + s.imbalance * 50));
        setLerpValue(`ob-${s.symbol}`, bidPct, {
          onUpdate: (v) => {
            const ob = document.getElementById(`ob-${s.symbol}`);
            if (ob) ob.style.width = `${v.toFixed(1)}%`;
          }
        });
      }
      const staleEl = document.getElementById(`stale-${s.symbol}`);
      if (s.stale && s.stale.length > 0) {
        staleEl.className = 'badge badge-stale';
        staleEl.textContent = s.stale[0];
      } else {
        staleEl.className = 'badge badge-fresh';
        staleEl.textContent = 'LIVE';
      }
      const aiEl = document.getElementById(`ai-${s.symbol}`);
      if (aiEl) {
        if (s.aiThinking) {
          aiEl.textContent = 'AI: Thinking...';
          aiEl.style.color = 'var(--neon-amber)';
          aiEl.style.borderColor = 'rgba(255, 184, 0, 0.5)';
        } else if (s.aiDecision) {
          const act = s.aiDecision.action;
          const setp = s.aiDecision.setup;
          const st = s.aiDecision.accepted ? 'OK' : (s.aiDecision.rejectReason ? `REJ:${s.aiDecision.rejectReason}` : 'REJ');
          aiEl.textContent = `AI: ${act} (${setp}) [${st}]`;
          aiEl.style.color = act.includes('LONG') ? 'var(--neon-green)' : act.includes('SHORT') ? 'var(--neon-red)' : 'var(--text-muted)';
          aiEl.style.borderColor = act.includes('LONG') ? 'rgba(0, 245, 155, 0.3)' : act.includes('SHORT') ? 'rgba(255, 59, 105, 0.3)' : 'var(--card-border)';
        } else {
          aiEl.textContent = 'AI: STANDBY';
          aiEl.style.color = 'var(--text-muted)';
          aiEl.style.borderColor = 'var(--card-border)';
        }
      }
    }

    function renderDesk(d) {
      if (!d) return;
      document.getElementById('desk-mode').textContent = d.mode || 'NORMAL';
      const r = Number(d.dayR) || 0;
      setLerpValue('desk-day-r', r, {
        decimals: 2,
        suffix: ' R',
        onUpdate: (v) => {
          const dayEl = document.getElementById('desk-day-r');
          if (dayEl) {
            dayEl.textContent = `${v >= 0 ? '+' : ''}${v.toFixed(2)} R`;
            dayEl.style.color = v > 0 ? 'var(--neon-green)' : v < 0 ? 'var(--neon-red)' : 'var(--text-main)';
          }
        }
      });
      const dd = Math.max(0, (Number(d.peakR) || 0) - (Number(d.cumR) || 0));
      setLerpValue('desk-dd', dd, { decimals: 2, suffix: ' R' });
      document.getElementById('desk-losses').textContent = d.consecLosses ?? 0;
      const exp = d.exposure || { positions: 0, riskUnits: 0 };
      document.getElementById('desk-exp').textContent = `${exp.positions} POS / ${exp.riskUnits} R`;
      if (d.harness) document.getElementById('harness-badge').textContent = `HARNESS: ${d.harness}`;
    }

    function renderLog(ev) {
      logs.push(ev);
      if (logs.length > 100) logs.shift();
      applyLogFilter();
    }

    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyLogFilter();
    }

    function isPnlOrRKey(key) {
      const k = String(key).toLowerCase();
      return k === 'r' || k === 'dayr' || k.endsWith('_r') || k.includes('pnl');
    }

    function formatLogVal(key, val) {
      if (typeof val === 'number') {
        if (isPnlOrRKey(key)) {
          const col = val > 0 ? 'var(--neon-green)' : val < 0 ? 'var(--neon-red)' : 'var(--neon-amber)';
          return `<span style="color:${col};font-weight:700;">${val > 0 ? '+' : ''}${val}</span>`;
        }
        return `<span style="color:var(--neon-amber);">${val}</span>`;
      }
      if (key === 'symbol') return `<span style="color:var(--neon-cyan);font-weight:700;">${val}</span>`;
      if (key === 'regime') {
        const str = String(val);
        const col = str.includes('DOWN') ? 'var(--neon-red)' : str.includes('UP') ? 'var(--neon-green)' : '#c084fc';
        return `<span style="color:${col};font-weight:600;">${val}</span>`;
      }
      if (key === 'mode') return `<span style="color:#c084fc;font-weight:600;">${val}</span>`;
      return `<span style="color:var(--text-main);">${String(val)}</span>`;
    }

    function formatLogContent(ev) {
      if (ev.msg === 'ai_thinking') {
        const sym = `<span style="color:var(--neon-cyan);font-weight:700;">${ev.symbol}</span>`;
        const mdl = `<span style="color:#c084fc;font-weight:600;">${ev.model}</span>`;
        return `🤖 <span style="color:var(--neon-amber);font-weight:700;">AI ANALYZING CANDLE:</span> ${sym} with ${mdl} (15m close)`;
      }
      if (ev.msg === 'decision') {
        const sym = `<span style="color:var(--neon-cyan);font-weight:700;">${ev.symbol}</span>`;
        const act = String(ev.action || 'NO_TRADE');
        const actCol = act.includes('LONG') ? 'var(--neon-green)' : act.includes('SHORT') ? 'var(--neon-red)' : 'var(--text-muted)';
        const actTag = `<span style="color:${actCol};font-weight:700;">${act}</span>`;
        const setup = `<span style="color:var(--text-main);">(${ev.setup || 'NONE'})</span>`;
        const status = ev.accepted
          ? `<span style="color:var(--neon-green);font-weight:700;">ACCEPTED</span>`
          : `<span style="color:var(--neon-amber);font-weight:600;">REJECTED (${ev.rejectReason || 'RISK'})</span>`;
        const lat = `<span style="color:var(--text-muted);font-size:11px;">${ev.latencyMs}ms</span>`;
        return `🧠 <span style="font-weight:700;">AI INTENT:</span> ${sym} ➔ ${actTag} ${setup} ${status} ${lat}`;
      }
      if (ev.msg === 'heartbeat') {
        const mark = `<span style="color:var(--neon-amber);font-weight:700;">${ev.mark}</span>`;
        const reg = `<span style="color:#c084fc;">(${ev.regime})</span>`;
        return `<span style="color:var(--neon-cyan);font-weight:700;">${ev.symbol}</span> @ ${mark} ${reg}`;
      }
      if (ev.msg === 'desk') {
        const mode = `<span style="color:#c084fc;font-weight:700;">${ev.mode}</span>`;
        const r = Number(ev.dayR) || 0;
        const rCol = r > 0 ? 'var(--neon-green)' : r < 0 ? 'var(--neon-red)' : 'var(--text-main)';
        const dayR = `<span style="color:${rCol};font-weight:700;">${r >= 0 ? '+' : ''}${ev.dayR} R</span>`;
        return `Desk ${mode} // DayR=${dayR}`;
      }
      if (ev.msg === 'trade_closed') {
        const sym = `<span style="color:var(--neon-cyan);font-weight:700;">${ev.symbol}</span>`;
        const r = Number(ev.r) || 0;
        const rCol = r > 0 ? 'var(--neon-green)' : r < 0 ? 'var(--neon-red)' : 'var(--neon-amber)';
        const rVal = `<span style="color:${rCol};font-weight:700;">${r >= 0 ? '+' : ''}${ev.r} R</span>`;
        return `TRADE CLOSED: ${sym} ${rVal} exit=${ev.exit}`;
      }
      const msgName = `<span style="font-weight:700;color:var(--neon-cyan);">${ev.msg}</span>`;
      const extras = Object.entries(ev)
        .filter(([k]) => !['t', 'level', 'msg'].includes(k))
        .map(([k, v]) => `<span style="color:var(--text-muted);">${k}=</span>${formatLogVal(k, v)}`)
        .join(' ');
      return extras ? `${msgName} ${extras}` : msgName;
    }

    function applyLogFilter() {
      const feed = document.getElementById('log-feed');
      feed.innerHTML = '';
      const filtered = logs.filter(ev => {
        if (activeFilter === 'ALL') return true;
        if (activeFilter === 'TRADES') return ev.msg.includes('trade');
        if (activeFilter === 'DECISIONS') return ev.msg.includes('decision') || ev.msg.includes('ai_thinking');
        if (activeFilter === 'WARN') return ev.level === 'warn' || ev.level === 'error';
        return true;
      });
      filtered.slice(-40).forEach(ev => {
        const item = document.createElement('div');
        item.className = `log-item ${ev.level || 'info'}`;
        const time = (ev.t || new Date().toISOString()).slice(11, 19);
        const lvl = (ev.level || 'info').toUpperCase();
        item.innerHTML = `<span class="log-time">${time}</span><span class="log-tag tag-${lvl}">${lvl}</span><div>${formatLogContent(ev)}</div>`;
        feed.appendChild(item);
      });
      feed.scrollTop = feed.scrollHeight;
    }

    async function toggleKill() {
      try {
        const res = await fetch('/api/kill', { method: 'POST' });
        const data = await res.json();
        updateKillState(data.killed);
      } catch (err) { alert('Kill switch toggle failed: ' + err.message); }
    }

    function updateKillState(killed) {
      const btn = document.getElementById('btn-kill');
      if (killed) {
        btn.textContent = 'HALTED // KILL ENGAGED';
        btn.className = 'btn-kill active';
      } else {
        btn.textContent = 'ARMED & SAFE';
        btn.className = 'btn-kill';
      }
    }

    function connect() {
      const es = new EventSource('/api/stream');
      const pill = document.getElementById('conn-pill');
      const text = document.getElementById('conn-text');
      es.onopen = () => {
        pill.className = 'status-pill';
        text.textContent = 'LIVE SSE';
      };
      es.onerror = () => {
        pill.className = 'status-pill offline';
        text.textContent = 'RECONNECTING';
      };
      es.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'snapshot') {
            updateKillState(msg.data.killed);
            renderDesk(msg.data.desk);
            if (msg.data.symbols) Object.values(msg.data.symbols).forEach(renderSymbol);
            if (msg.data.events) msg.data.events.forEach(renderLog);
          } else if (msg.type === 'event') {
            const ev = msg.event;
            if (ev.msg === 'heartbeat' || ev.msg === 'tick') renderSymbol(ev);
            else if (ev.msg === 'desk') renderDesk(ev);
            // Exclude high-frequency price ticks from the event log to avoid spamming the feed
            if (ev.msg !== 'tick') renderLog(ev);
          } else if (msg.type === 'kill') {
            updateKillState(msg.killed);
          }
        } catch { /* ignore */ }
      };
    }
    connect();
  </script>
</body>
</html>
